<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Finkenroulette</title>

    <!-- #region Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- #endregion Fonts -->

    <!-- #region Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon/favicon-96x96.png?v=20260729"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon/favicon.svg?v=20260729"
    />
    <link rel="shortcut icon" href="/favicon/favicon.ico?v=20260729" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png?v=20260729"
    />
    <meta name="apple-mobile-web-app-title" content="Finkenroulette" />
    <link rel="manifest" href="/favicon/site.webmanifest?v=20260729" />
    <!-- #endregion Favicon  -->
  </head>
  <body>
    <div id="app">
      <header>
        <div class="header-content">
          <h1>Finkenroulette</h1>
          <button class="burger-menu" type="button" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </header>
      <div id="overlay-bg" class="overlay hidden"></div>
      <div id="burger-menu-panel" class="overlay hidden">
        <div class="menu-section">
          <h2>Kategorien</h2>
          <div id="category-checkboxes"></div>
        </div>
        <div class="menu-section">
          <h2>Einschränkungen</h2>
          <label class="category-option">
            <input
              id="alcohol-free-only"
              type="checkbox"
              data-setting="alcoholFreeOnly"
            />
            <span>Nur Alkoholfrei</span>
          </label>
          <label class="category-option">
            <input
              id="gluten-free-only"
              type="checkbox"
              data-setting="glutenFreeOnly"
            />
            <span>Nur Glutenfrei</span>
          </label>
        </div>
        <div class="menu-section">
          <h2>Verlauf</h2>
          <button id="show-history">Verlauf anzeigen</button>
          <button id="clear-history">Verlauf löschen</button>
          <label class="category-option">
            <input
              id="avoid-duplicates"
              type="checkbox"
              data-setting="avoidDuplicates"
            />
            <span>Wiederholungen vermeiden</span>
          </label>
        </div>
      </div>
      <div class="history-wrapper overlay hidden">
        <div class="history-container">
          <button class="history-close" type="button">×</button>
          <div>
            <h1 id="history-title">Verlauf</h1>
          </div>
          <div id="history-list"></div>
        </div>
      </div>
      <div id="roulette-button"></div>
      <div id="result-wrapper">
        <div id="result">
          <div id="beer-name"><p>↑ Klick hier! ↑</p></div>
          <div id="beer-info"><p></p></div>
          <div id="beer-pricing"></div>
          <div id="beer-description"><p></p></div>
          <div id="beer-hint"><p></p></div>
        </div>
      </div>
      <div class="message-wrapper hidden">
        <div class="message-container">
          <span class="message-icon"></span>
          <span id="message-content"></span>
          <span class="message-icon"></span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js?v=1.1.1"></script>
  </body>
</html>
